name: JobSafe Daily Check

on:
  schedule:
    # 00:00 UTC = 09:00 KST
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Run scheduled JobSafe checks
        env:
          CRON_SECRET: ${{ secrets.JOBSAFE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "JOBSAFE_CRON_SECRET repository secret is not configured."
            exit 1
          fi

          curl --fail-with-body \
            --retry 3 \
            --retry-delay 10 \
            --max-time 180 \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            https://jobsafe-api.onrender.com/api/maintenance/run-checks
